# Testy backendu Fruit Farm — uruchamiane przy każdym pushu/PR na main.
# Buduje moduł (mvn clean test) i zwraca zielony/czerwony status check.
# Testy integracyjne/repozytoryjne używają Testcontainers (PostgreSQL); na
# runnerze ubuntu-latest Docker jest preinstalowany, więc — w przeciwieństwie do
# lokalnego Rancher Desktop — NIE trzeba ustawiać DOCKER_HOST. Surefire wymusza
# już api.version=1.41 i TESTCONTAINERS_RYUK_DISABLED=true (patrz backend/pom.xml).
name: Backend tests

on:
  push:
    branches: [main]
    # Odpalamy tylko gdy zmienia się kod backendu albo sam workflow.
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Jeden bieg testów na gałąź; nowszy push anuluje starszy, jeszcze trwający.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mvn clean test (JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Temurin 21 — projekt celuje w Java 21 (Lombok nie kompiluje się pod JDK 25).
      # cache: maven trzyma ~/.m2 między biegami, żeby nie pobierać zależności co raz.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Wrapper bywa commitowany bez bitu wykonywalnego — nadajemy go jawnie,
      # żeby ./mvnw zadziałało niezależnie od trybu pliku w gicie.
      - name: Make mvnw executable
        run: chmod +x mvnw

      # clean test = kompilacja (build) + pełny zestaw testów (surefire łapie też
      # klasy *IntegrationTest). Zielony/czerwony status biegnie z kodu wyjścia.
      - name: Build & run tests
        run: ./mvnw -B -ntp clean test

      # Raporty surefire jako artefakt — przydatne do diagnozy czerwonego biegu.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7
