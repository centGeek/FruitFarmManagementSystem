# CI Fruit Farm — uruchamiane przy KAŻDYM pushu i PR na main (bez filtra ścieżek),
# żeby każdy commit na main dostał zielony/czerwony status check.
#  - backend: kompilacja + pełny zestaw testów (mvn clean test), JDK 21.
#  - frontend: build produkcyjny (vite).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Jeden bieg na gałąź; nowszy push anuluje starszy, jeszcze trwający.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & test (JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Temurin 21 — projekt celuje w Java 21 (Lombok nie kompiluje się pod JDK 25).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Wrapper bywa commitowany bez bitu wykonywalnego — nadajemy go jawnie.
      - name: Make mvnw executable
        run: chmod +x mvnw

      # clean test = kompilacja (build) + pełny zestaw testów. Testy integracyjne/
      # repozytoryjne używają Testcontainers (PostgreSQL); na ubuntu-latest Docker jest
      # preinstalowany, więc NIE trzeba ustawiać DOCKER_HOST (inaczej niż lokalnie).
      - name: Build & test
        run: ./mvnw -B -ntp clean test

      # Raporty surefire jako artefakt — przydatne do diagnozy czerwonego biegu.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # build:docker = sam `vite build`. Pełny `npm run build` (tsc -b && vite build)
      # NIE jest tu używany, bo repo ma ~145 pre-istniejących błędów typów (tsc).
      - name: Build
        run: npm run build:docker
