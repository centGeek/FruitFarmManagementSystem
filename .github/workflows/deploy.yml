# Wdrożenie Fruit Farm na Azure Container Apps.
# Buduje obrazy (linux/amd64), wypycha na GitHub Container Registry i aktualizuje
# ca-backend / ca-frontend na świeży tag. Parytet z .claude/skills/azure-deploy/run.sh.
#
# Wymaganie wstępne: Container Apps (ca-backend, ca-frontend) oraz PostgreSQL Flexible
# Server są tworzone poza tym workflow (out-of-band). Ten workflow ich NIE tworzy —
# tylko aktualizuje obraz i zmienne środowiskowe istniejących aplikacji.
name: Deploy to Azure

on:
  push:
    branches: [main]
    # Wyzwalamy tylko gdy zmienia się kod backendu, frontendu albo sam workflow.
    # Uwaga: zmiany w .claude/skills/azure-deploy/run.sh ani w compose.full.yaml
    # NIE wyzwalają deployu (świadomie) — parytet z run.sh pilnujemy ręcznie.
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Co wdrożyć"
        type: choice
        required: true
        default: both
        options:
          - both
          - backend
          - frontend

# Minimalne uprawnienia: odczyt repo, push obrazów do ghcr, token OIDC do az login
permissions:
  contents: read
  packages: write
  id-token: write

# Stałe współdzielone przez kroki (parytet z run.sh)
env:
  RG: rg-fruitfarm
  SUB: 61ad12b2-ac0f-49cb-af8b-049bff4a6d80 # Azure for Students
  BE_IMG: ghcr.io/centgeek/ff-backend
  FE_IMG: ghcr.io/centgeek/ff-frontend
  # Pinujemy wersję Azure CLI dla powtarzalności — 'latest' potrafi się zmienić między
  # uruchomieniami i po cichu zepsuć zachowanie containerapp/secret bez zmiany kodu.
  AZ_CLI_VERSION: 2.69.0

# Jedno wdrożenie na raz. Z cancel-in-progress: false trwające wdrożenie kończy się
# pierwsze (nie przerywamy rolloutu rewizji), a nowsze czeka w kolejce i rusza po nim.
# GitHub trzyma dokładnie jeden oczekujący run na grupę — pośrednie są pomijane.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cel deployu: push na main => both; ręczne uruchomienie => wybrany input
      - name: Ustal cel i tag obrazów
        id: vars
        run: |
          TARGET="${{ github.event.inputs.target }}"
          [ -z "$TARGET" ] && TARGET="both"
          # Krótki SHA jako niemutowalny tag. Gałąź -dirty istnieje tylko dla parytetu
          # z run.sh — w CI drzewo po checkout@v4 jest zawsze czyste, więc to no-op
          # (tag = czysty krótki SHA). Zostawione, by tagowanie było identyczne z run.sh.
          SHA="$(git rev-parse --short HEAD)"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            SHA="${SHA}-dirty-$(date +%H%M%S)"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "tag=$SHA" >> "$GITHUB_OUTPUT"
          echo "==> Cel: $TARGET, tag: $SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logowanie do ghcr wbudowanym GITHUB_TOKEN (permissions: packages: write)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build & push: backend ---
      # provenance/sbom WYŁĄCZONE: build-push-action domyślnie dokleja atestację
      # provenance przy pushu do rejestru (publiczne repo => mode=max), tworząc OCI image
      # index z manifestem atestacji o platformie unknown/unknown. Azure Container Apps
      # odrzuca taki tag ("Selected tag uses an invalid operating system ''"). Wyłączenie
      # daje pojedynczy manifest linux/amd64 — i zarazem parytet z 'docker buildx build' w run.sh.
      - name: Build & push backend
        if: steps.vars.outputs.target == 'backend' || steps.vars.outputs.target == 'both'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64 # Azure wymaga amd64; na ubuntu-latest to natywna arch
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ env.BE_IMG }}:${{ steps.vars.outputs.tag }}
            ${{ env.BE_IMG }}:latest

      # --- Build & push: frontend ---
      # Bez build-arg VITE_BACKEND_URL — frontend używa relatywnych ścieżek /api,
      # a adres backendu wchodzi w runtime jako BACKEND_ORIGIN (proxy nginx).
      # provenance/sbom wyłączone z tego samego powodu co przy backendzie (patrz wyżej).
      - name: Build & push frontend
        if: steps.vars.outputs.target == 'frontend' || steps.vars.outputs.target == 'both'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ env.FE_IMG }}:${{ steps.vars.outputs.tag }}
            ${{ env.FE_IMG }}:latest

      # Logowanie do Azure przez OIDC (bez długowiecznych poświadczeń)
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Adres backendu pobierany w runtime — potrzebny dla BACKEND_ORIGIN frontendu.
      # ca-backend musi już istnieć (tworzony out-of-band). Jeśli go nie ma, krok kończy
      # się błędem — także dla deployu target=frontend. To świadomy parytet z run.sh,
      # które również wymaga istniejącego ca-backend zanim ruszy deploy frontendu.
      - name: Pobierz FQDN backendu
        id: be
        uses: azure/cli@v2
        with:
          azcliversion: ${{ env.AZ_CLI_VERSION }}
          inlineScript: |
            az account set --subscription "$SUB"
            BE_FQDN=$(az containerapp show -n ca-backend -g "$RG" \
              --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null)
            [ -n "$BE_FQDN" ] || { echo "BŁĄD: nie znaleziono ca-backend w $RG (musi istnieć przed deployem)." >&2; exit 1; }
            echo "fqdn=$BE_FQDN" >> "$GITHUB_OUTPUT"
            echo "==> Backend FQDN: $BE_FQDN"

      # --- Aktualizacja ca-backend (+ sekret jwt-secret raz, jeśli go nie ma) ---
      - name: Aktualizuj ca-backend
        if: steps.vars.outputs.target == 'backend' || steps.vars.outputs.target == 'both'
        uses: azure/cli@v2
        with:
          azcliversion: ${{ env.AZ_CLI_VERSION }}
          inlineScript: |
            az account set --subscription "$SUB"
            # Sekret JWT tworzymy raz; istniejącego NIE nadpisujemy (nie unieważniamy tokenów)
            HAS_SECRET=$(az containerapp secret list -n ca-backend -g "$RG" \
              --query "[?name=='jwt-secret'] | length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${HAS_SECRET:-0}" = "0" ]; then
              echo "==> Tworzę sekret jwt-secret (jednorazowo)..."
              az containerapp secret set -n ca-backend -g "$RG" \
                --secrets "jwt-secret=$(openssl rand -hex 32)" --only-show-errors >/dev/null
            fi
            echo "==> Aktualizuję ca-backend → ${BE_IMG}:${TAG}"
            az containerapp update -n ca-backend -g "$RG" --image "${BE_IMG}:${TAG}" \
              --set-env-vars \
                APP_COOKIE_SECURE=true \
                APP_COOKIE_SAME_SITE=Lax \
                SECURITY_BCRYPT_STRENGTH=12 \
                JWT_SECRET_KEY=secretref:jwt-secret \
              --only-show-errors >/dev/null
        env:
          TAG: ${{ steps.vars.outputs.tag }}

      # --- Aktualizacja ca-frontend (BACKEND_ORIGIN w runtime) ---
      - name: Aktualizuj ca-frontend
        if: steps.vars.outputs.target == 'frontend' || steps.vars.outputs.target == 'both'
        uses: azure/cli@v2
        with:
          azcliversion: ${{ env.AZ_CLI_VERSION }}
          inlineScript: |
            az account set --subscription "$SUB"
            echo "==> Aktualizuję ca-frontend → ${FE_IMG}:${TAG} (BACKEND_ORIGIN=https://${BE_FQDN})"
            az containerapp update -n ca-frontend -g "$RG" --image "${FE_IMG}:${TAG}" \
              --set-env-vars "BACKEND_ORIGIN=https://${BE_FQDN}" \
              --only-show-errors >/dev/null
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          BE_FQDN: ${{ steps.be.outputs.fqdn }}

      - name: Podsumowanie
        if: always()
        run: |
          echo "Cel: ${{ steps.vars.outputs.target }}"
          echo "Tag: ${{ steps.vars.outputs.tag }}"
          echo "Backend FQDN: ${{ steps.be.outputs.fqdn }}"
