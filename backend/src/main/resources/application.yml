spring:
  application:
    name: fruit-farm-management

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        # Bez tego mapowanie list (np. GET /api/work-entries/week) odpalało lazy-load per wiersz
        # (user, gardener, credentials, sector, coordinates) → 150-250 zapytań na żądanie, każde
        # płacące RTT do bazy na Azure. Batch zamienia te N+1 w kilka zapytań IN(...). Globalnie,
        # bez zmiany zachowania API.
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    sql-migration-suffixes: .sql
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    mixed: false
server:
  port: ${SERVER_PORT:8091}

logging:
  level:
    # INFO zamiast DEBUG — DEBUG Flyway przy każdym (zimnym) starcie to zbędny szum i I/O w logach.
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: INFO
jwt:
  secret:
    key: ${JWT_SECRET_KEY:9683bc6f47cc73bd0dc0fd3738cc59ca1a15637eee20af3dc7b9aa1165716db7ba98e845}

# Konfiguracja cross-origin / ciasteczek.
# Lokalnie: domyślne wartości (HTTP, ten sam host).
# Produkcja (front i backend na różnych domenach po HTTPS):
#   APP_COOKIE_SECURE=true, APP_COOKIE_SAME_SITE=None,
#   CORS_ALLOWED_ORIGINS=https://<adres-frontendu>
app:
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
security:
  bcrypt:
    # Domyślnie 10 (rozsądny koszt produkcyjny). Istniejące hashe weryfikują się dalej —
    # siła jest zaszyta w samym hashu, więc podbicie nie wymaga migracji.
    # Testy nadpisują na 4 (src/test/resources/application.yml) dla szybkości.
    strength: ${SECURITY_BCRYPT_STRENGTH:10}